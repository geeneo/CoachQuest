name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check rendered nginx config
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -e PROXY_SHARED_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e API_UPSTREAM=api:8000 \
            -e NGINX_ENVSUBST_FILTER='^(PROXY_SHARED_SECRET|API_UPSTREAM)$' \
            -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
            nginx:1.27-alpine sh -c 'rm -f /etc/nginx/conf.d/default.conf && /docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
