# Production stack. Works with `docker compose` and as a Portainer stack.
# Every value comes from .env (or Portainer's stack environment variables).
# Images are built on the server by build.sh, so pull_policy is never.

name: ${COMPOSE_PROJECT:-coachquest}

services:
  api:
    image: ${APP_NAME:-coachquest}-api:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ${DATA_PATH:-./data}:/data
    networks: [internal]
    # No ports: the API is reachable only through the proxy.

  # Postgres, only when DATABASE_URL points at it (docs/postgres.md). The "postgres" profile keeps it
  # off otherwise; deploy.sh starts it when DATABASE_URL is postgresql.
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coachquest}
      POSTGRES_USER: ${POSTGRES_USER:-coachquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ${PG_DATA_PATH:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coachquest} -d ${POSTGRES_DB:-coachquest}"]
      interval: 10s
      retries: 6
    networks: [internal]
    # No ports: only the API reaches it.

  proxy:
    image: ${APP_NAME:-coachquest}-proxy:latest
    pull_policy: never
    restart: unless-stopped
    depends_on: [api]
    environment:
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET in .env}
      API_UPSTREAM: api:8000
      # Only these two variables are substituted into the nginx templates.
      NGINX_ENVSUBST_FILTER: "^(PROXY_SHARED_SECRET|API_UPSTREAM)$$"
    ports:
      - "${APP_PORT:-3040}:8080"
    networks: [internal]

networks:
  internal:
